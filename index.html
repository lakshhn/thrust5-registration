<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thrust 5.0 — Water Rocket Competition | Aero Fabrication Club IIITDMJ</title>
  <meta name="description" content="Register your team for Thrust 5.0 — the flagship water rocket competition by Aero Fabrication Club, IIITDMJ. Exclusively for first-year students." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0D1117',
              surface: '#111827',
              border: '#1E3A5F',
              blue: '#1E6FBA',
              cyan: '#29ABE2',
              muted: '#64748B',
            }
          },
          fontFamily: {
            heading: ['Space Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Framer Motion UMD for immediate preview -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; background: #0D1117; color: #fff; font-family: 'Inter', sans-serif; }
    body { margin: 0; padding: 0; overflow-x: hidden; }
    
    .mobile-input {
      font-size: 16px !important;
      height: 48px;
      background: #0a0f16;
      border: 1.5px solid #1E3A5F;
      color: #ffffff;
      padding: 0 16px;
      border-radius: 8px;
      width: 100%;
      transition: border-color 0.2s;
      outline: none;
    }
    .mobile-input:focus { border-color: #29ABE2; }
    .mobile-input::placeholder { color: #4B6280; }
    .mobile-input option { background: #0D1117; }
    
    .btn-launch {
      background: #29ABE2;
      color: #0D1117;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 8px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease-in-out;
      border: none;
      cursor: pointer;
    }
    .btn-launch:hover { background: #1E6FBA; color: #ffffff; }
    .btn-launch:active { transform: scale(0.98); }

    .cyber-card {
      background: #0f1724;
      border: 1px solid #1E3A5F;
      border-radius: 12px;
    }
  </style>
</head>
<body class="bg-[#0D1117] text-white">
  <div id="root"></div>

  <!-- Standard Vite Module Script -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Fallback standalone runtime script for static file viewing -->
  <script type="text/babel">
    if (!window.__VITE_REACT_LOADED__) {
      const { useState, useEffect } = React;
      const FM = window.FramerMotion || window.Motion || {};
      const motion = FM.motion || {
        div: (props) => <div {...props} />,
        h1: (props) => <h1 {...props} />,
        p: (props) => <p {...props} />,
        form: (props) => <form {...props} />,
        section: (props) => <section {...props} />,
        header: (props) => <header {...props} />
      };

      function Navbar() {
        const [scrolled, setScrolled] = useState(false);
        const [open, setOpen] = useState(false);
        useEffect(() => {
          const h = () => setScrolled(window.scrollY > 20);
          window.addEventListener('scroll', h);
          return () => window.removeEventListener('scroll', h);
        }, []);
        return (
          <header className={`fixed top-0 left-0 right-0 z-50 transition-all ${scrolled ? 'bg-[#0D1117]/95 border-b border-[#1E3A5F] py-2.5 shadow-lg' : 'bg-transparent py-4'}`}>
            <div className="max-w-6xl mx-auto px-4 flex items-center justify-between">
              <a href="#" className="flex items-center gap-3">
                <img src="/afc-user-logo.jpg" alt="Aero Fabrication Club" className="h-10 w-auto object-contain block" onError={(e)=>{e.target.onerror=null; e.target.src='/afc-logo.png';}} />
                <div>
                  <div className="font-heading font-extrabold text-base tracking-wider text-white">THRUST <span className="text-[#29ABE2]">5.0</span></div>
                  <div className="text-[10px] font-mono text-[#29ABE2] uppercase font-bold tracking-widest">Aero Fabrication Club · IIITDMJ</div>
                </div>
              </a>
              <div className="hidden md:flex items-center gap-6 text-xs font-semibold uppercase tracking-wider text-[#94A3B8]">
                <a href="#details" className="hover:text-[#29ABE2]">Overview</a>
                <a href="#rules" className="hover:text-[#29ABE2]">Rules</a>
                <a href="#register" className="btn-launch px-5 py-2 text-xs">Register Team</a>
              </div>
              <button onClick={() => setOpen(!open)} className="md:hidden p-2 text-[#29ABE2]">
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  {open ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /> : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />}
                </svg>
              </button>
            </div>
            {open && (
              <div className="md:hidden bg-[#0D1117] border-b border-[#1E3A5F] px-4 py-4 space-y-3">
                <a href="#details" onClick={() => setOpen(false)} className="block text-sm text-[#94A3B8]">Overview</a>
                <a href="#rules" onClick={() => setOpen(false)} className="block text-sm text-[#94A3B8]">Rules</a>
                <a href="#register" onClick={() => setOpen(false)} className="btn-launch w-full text-center py-2.5 text-xs">Register Team</a>
              </div>
            )}
          </header>
        );
      }

      function Hero() {
        return (
          <section className="relative min-h-[90vh] flex items-center justify-center pt-24 pb-16 px-4 text-center bg-[#0D1117]">
            <div className="max-w-3xl mx-auto">
              <div className="mb-6 flex justify-center">
                <img src="/afc-user-logo.jpg" alt="Aero Fabrication Club" className="h-24 sm:h-28 w-auto object-contain block" onError={(e)=>{e.target.onerror=null; e.target.src='/afc-logo.png';}} />
              </div>

              <div className="my-2 py-2 flex flex-col items-center justify-center">
                <img src="/thrust5-title-transparent.png" alt="THRUST 5.0" className="w-full max-w-2xl object-contain drop-shadow-[0_0_40px_rgba(41,171,226,0.6)] mix-blend-screen" onError={(e)=>{e.target.style.display='none';}} />
              </div>

              <p className="text-base sm:text-xl text-[#94A3B8] max-w-xl mx-auto mb-2">
                The Ultimate Water Rocket Challenge
              </p>
              <div className="font-heading font-bold text-xs sm:text-sm text-[#29ABE2] tracking-widest uppercase mb-8">
                Exclusively for First-Year Students
              </div>
              <div className="flex flex-col sm:flex-row gap-3 justify-center items-stretch max-w-md mx-auto mb-12">
                <a href="#register" className="btn-launch text-sm py-3.5 px-8 font-bold">Register Team</a>
                <a href="#details" className="px-6 py-3.5 rounded-lg border border-[#1E3A5F] text-[#94A3B8] font-heading font-semibold text-xs uppercase tracking-wider">Event Details</a>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-left">
                <div className="p-3 rounded-lg bg-[#111827] border border-[#1E3A5F]">
                  <div className="text-[10px] text-[#29ABE2] font-mono uppercase font-bold">Eligibility</div>
                  <div className="text-xs font-semibold text-white mt-0.5">1st Years Only</div>
                </div>
                <div className="p-3 rounded-lg bg-[#111827] border border-[#1E3A5F]">
                  <div className="text-[10px] text-[#29ABE2] font-mono uppercase font-bold">Team Size</div>
                  <div className="text-xs font-semibold text-white mt-0.5">2 - 4 Members</div>
                </div>
                <div className="p-3 rounded-lg bg-[#111827] border border-[#1E3A5F]">
                  <div className="text-[10px] text-[#29ABE2] font-mono uppercase font-bold">Fee</div>
                  <div className="text-xs font-semibold text-white mt-0.5">₹120 / Team</div>
                </div>
                <div className="p-3 rounded-lg bg-[#111827] border border-[#1E3A5F]">
                  <div className="text-[10px] text-[#29ABE2] font-mono uppercase font-bold">Host</div>
                  <div className="text-xs font-semibold text-white mt-0.5">AFC IIITDMJ</div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function EventDetails() {
        const cards = [
          { label: 'Date', val: 'TBA 2025' },
          { label: 'Time', val: '09:00 AM' },
          { label: 'Venue', val: 'IIITDMJ Grounds' },
          { label: 'Entry Fee', val: '₹120 / Team' },
        ];
        return (
          <section id="details" className="py-16 px-4 bg-[#0D1117] border-t border-[#1E3A5F]">
            <div className="max-w-5xl mx-auto">
              <div className="text-center mb-12">
                <div className="font-heading text-xs font-semibold text-[#29ABE2] uppercase tracking-widest mb-1">Event Overview</div>
                <h2 className="font-heading font-extrabold text-3xl sm:text-5xl text-white tracking-tight mb-3">
                  Engineer. Build. <span className="text-[#29ABE2]">Launch.</span>
                </h2>
                <p className="text-sm sm:text-base text-[#94A3B8] max-w-2xl mx-auto leading-relaxed">
                  Design and fabricate high-performance water rockets. Compete for max flight height, aerodynamic stability, and engineering finesse.
                </p>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-10">
                {cards.map(c => (
                  <div key={c.label} className="cyber-card p-4">
                    <div className="text-[10px] text-[#29ABE2] font-mono font-bold uppercase">{c.label}</div>
                    <div className="font-heading font-bold text-lg text-white mt-1">{c.val}</div>
                  </div>
                ))}
              </div>
              <div id="rules" className="cyber-card p-6 border-l-4 border-l-[#29ABE2]">
                <h3 className="font-heading font-bold text-base text-white mb-3 flex items-center gap-2">Competition Format & Guidelines</h3>
                <ul className="space-y-2 text-xs sm:text-sm text-[#94A3B8]">
                  <li>• Exclusively for 1st-year undergraduate students of IIITDMJ.</li>
                  <li>• Team size: 2 to 4 members with a designated Team Leader.</li>
                  <li>• Propulsion: Water + pressurized air only (no chemical propellants).</li>
                  <li>• Judged on apogee (max height), flight stability, and rocket aesthetics.</li>
                </ul>
              </div>
            </div>
          </section>
        );
      }

      function RegistrationForm({ onSubmittedStateChange }) {
        const [form, setForm] = useState({
          teamName: '', teamLeader: '', leaderRoll: '', leaderPhone: '',
          m1Name: '', m1Roll: '', m2Name: '', m2Roll: '', m3Name: '', m3Roll: ''
        });
        const [file, setFile] = useState(null);
        const [filePreview, setFilePreview] = useState(null);
        const [fileBase64, setFileBase64] = useState('');
        const [errors, setErrors] = useState({});
        const [submittedData, setSubmittedData] = useState(null);

        useEffect(() => {
          if (onSubmittedStateChange) onSubmittedStateChange(!!submittedData);
        }, [submittedData]);

        const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
        
        const handleFile = (f) => {
          if (!f) return;
          setFile(f);
          if (f.type.startsWith('image/')) {
            const r = new FileReader();
            r.onloadend = () => { setFilePreview(r.result); setFileBase64(r.result.split(',')[1]); };
            r.readAsDataURL(f);
          } else {
            setFilePreview(null);
            const r = new FileReader();
            r.onloadend = () => setFileBase64(r.result.split(',')[1]);
            r.readAsDataURL(f);
          }
        };

        const validate = () => {
          const e = {};
          if (!form.teamName.trim()) e.teamName = 'Required';
          if (!form.teamLeader.trim()) e.teamLeader = 'Required';
          if (!form.leaderRoll.trim()) e.leaderRoll = 'Required';
          else if (!/^\d{10}$/.test(form.leaderPhone.replace(/\s/g, ''))) e.leaderPhone = 'Enter valid 10-digit number';
          if (!form.m1Name.trim()) e.m1Name = 'Required';
          if (!form.m1Roll.trim()) e.m1Roll = 'Required';
          if (!form.m2Name.trim()) e.m2Name = 'Required';
          if (!form.m2Roll.trim()) e.m2Roll = 'Required';
          if (!file) e.file = 'Payment receipt file is required';
          setErrors(e);
          return Object.keys(e).length === 0;
        };

        const handleSubmit = async (ev) => {
          ev.preventDefault();
          if (validate()) {
            const data = { regId: 'THRUST5-' + Math.floor(100000 + Math.random() * 900000), timestamp: new Date().toISOString(), ...form, fileName: file.name, fileData: fileBase64 };
            const payloadStr = JSON.stringify(data);
            const targetUrl = 'https://script.google.com/macros/s/AKfycbzbRFibdQV3w_UBY_iNif-qMuTWcMEtPahh56swLO2HVvGIa-2WAqhp38o70jzllYTD/exec';
            
            try {
              const iframeName = 'thrust5_iframe_idx_single';
              let iframe = document.getElementById(iframeName);
              if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.name = iframeName;
                iframe.id = iframeName;
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
              }
              const formEl = document.createElement('form');
              formEl.method = 'POST';
              formEl.action = targetUrl;
              formEl.target = iframeName;
              const inputEl = document.createElement('input');
              inputEl.type = 'hidden';
              inputEl.name = 'payload';
              inputEl.value = payloadStr;
              formEl.appendChild(inputEl);
              document.body.appendChild(formEl);
              formEl.submit();
              setTimeout(() => { if (formEl.parentNode) formEl.parentNode.removeChild(formEl); }, 1200);
            } catch(e) {}

            setSubmittedData(data);
          }
        };

        const handleDone = () => {
          setSubmittedData(null);
          setForm({ teamName: '', teamLeader: '', leaderRoll: '', leaderPhone: '', m1Name: '', m1Roll: '', m2Name: '', m2Roll: '', m3Name: '', m3Roll: '' });
          setFile(null); setFilePreview(null); setFileBase64('');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        if (submittedData) return (
          <section id="register" className="py-20 px-4 bg-[#080C11] border-t border-[#1E3A5F]">
            <div className="max-w-xl mx-auto cyber-card p-8 text-center space-y-5 relative overflow-hidden">
              <img src="/afc-user-logo.jpg" alt="Aero Fabrication Club" className="h-20 w-auto mx-auto mb-4 block object-contain" onError={(e)=>{e.target.onerror=null; e.target.src='/afc-logo.png';}} />

              <div>
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono font-semibold uppercase tracking-wider mb-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  Registration Confirmed
                </div>
                <h3 className="font-heading font-extrabold text-3xl text-white tracking-tight">Registration <span className="text-[#29ABE2]">Successful!</span></h3>
                <p className="text-xs text-[#94A3B8] mt-1">Your team registration and payment proof have been officially logged in the competition sheet.</p>
              </div>

              <div className="bg-[#0A0F16] border border-[#1E3A5F] rounded-xl p-5 text-left space-y-3 font-sans">
                <div className="flex justify-between items-center border-b border-[#1E3A5F] pb-3">
                  <div>
                    <div className="text-[10px] font-mono uppercase tracking-widest text-[#64748B]">Registered Team</div>
                    <div className="font-heading font-bold text-lg text-white">{submittedData.teamName}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-[10px] font-mono uppercase tracking-widest text-[#64748B]">Reg ID</div>
                    <div className="font-mono font-bold text-sm text-[#29ABE2] bg-[#29ABE2]/10 px-2 py-0.5 rounded border border-[#29ABE2]/30">{submittedData.regId}</div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs pt-1">
                  <div>
                    <span className="text-[#64748B] block text-[10px] uppercase font-mono">Team Leader</span>
                    <span className="font-semibold text-white">{submittedData.teamLeader}</span>
                    <span className="text-[11px] text-[#94A3B8] block">({submittedData.leaderRoll})</span>
                  </div>
                  <div>
                    <span className="text-[#64748B] block text-[10px] uppercase font-mono">Leader Phone</span>
                    <span className="font-mono text-white">{submittedData.leaderPhone}</span>
                  </div>
                  <div>
                    <span className="text-[#64748B] block text-[10px] uppercase font-mono">Teammates</span>
                    <span className="text-white font-medium">{submittedData.m1Name}, {submittedData.m2Name}{submittedData.m3Name ? `, ${submittedData.m3Name}` : ''}</span>
                  </div>
                  <div>
                    <span className="text-[#64748B] block text-[10px] uppercase font-mono">Payment Status</span>
                    <span className="text-emerald-400 font-bold">₹120 Submitted</span>
                  </div>
                </div>
              </div>

              <div className="bg-[#1E6FBA]/10 border border-[#29ABE2]/30 rounded-xl p-4 text-left space-y-1.5">
                <div className="flex items-center gap-2 text-xs font-bold text-[#29ABE2] uppercase tracking-wider">
                  Important Notice for Participants:
                </div>
                <p className="text-xs text-slate-200 leading-relaxed">
                  Stay tuned on the official <strong>Thrust 5.0 WhatsApp Group</strong> and website for the official rulebook, launch schedule, domain briefing, and event guidelines!
                </p>
              </div>

              <button onClick={handleDone} className="w-full py-4 px-6 rounded-xl bg-gradient-to-r from-[#1E6FBA] to-[#29ABE2] hover:opacity-95 text-white font-heading font-extrabold text-sm uppercase tracking-wider shadow-lg shadow-[#29ABE2]/20">
                Registration Done
              </button>
            </div>
          </section>
        );

        return (
          <section id="register" className="py-16 px-4 bg-[#080C11] border-t border-[#1E3A5F]">
            <div className="max-w-2xl mx-auto">
              <div className="text-center mb-10">
                <div className="font-heading text-xs font-semibold text-[#29ABE2] uppercase tracking-widest mb-1">In-App Registration</div>
                <h2 className="font-heading font-extrabold text-3xl sm:text-4xl text-white tracking-tight mb-2">Register Your <span className="text-[#29ABE2]">Team</span></h2>
                <p className="text-xs sm:text-sm text-[#94A3B8]">Registration Fee: ₹120 / Team · Upload screenshot directly below</p>
              </div>

              <form onSubmit={handleSubmit} className="cyber-card p-5 sm:p-8 space-y-6">
                <div>
                  <div className="font-heading text-xs font-bold text-[#29ABE2] uppercase tracking-wider mb-3">1. Team Information</div>
                  <div className="space-y-3">
                    <div>
                      <label className="block text-xs text-[#94A3B8] mb-1">Team Name <span className="text-[#29ABE2]">*</span></label>
                      <input type="text" className="mobile-input" placeholder="e.g. AeroWolves" value={form.teamName} onChange={e => set('teamName', e.target.value)} />
                      {errors.teamName && <p className="text-red-400 text-xs mt-1">{errors.teamName}</p>}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs text-[#94A3B8] mb-1">Leader Name <span className="text-[#29ABE2]">*</span></label>
                        <input type="text" className="mobile-input" placeholder="Full Name" value={form.teamLeader} onChange={e => set('teamLeader', e.target.value)} />
                        {errors.teamLeader && <p className="text-red-400 text-xs mt-1">{errors.teamLeader}</p>}
                      </div>
                      <div>
                        <label className="block text-xs text-[#94A3B8] mb-1">Leader Roll No <span className="text-[#29ABE2]">*</span></label>
                        <input type="text" className="mobile-input" placeholder="e.g. 2024UCS001" value={form.leaderRoll} onChange={e => set('leaderRoll', e.target.value)} />
                        {errors.leaderRoll && <p className="text-red-400 text-xs mt-1">{errors.leaderRoll}</p>}
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs text-[#94A3B8] mb-1">Leader Mobile No <span className="text-[#29ABE2]">*</span></label>
                      <input type="tel" className="mobile-input" placeholder="10-digit Mobile Number" value={form.leaderPhone} onChange={e => set('leaderPhone', e.target.value)} />
                      {errors.leaderPhone && <p className="text-red-400 text-xs mt-1">{errors.leaderPhone}</p>}
                    </div>
                  </div>
                </div>

                <div>
                  <div className="font-heading text-xs font-bold text-[#29ABE2] uppercase tracking-wider mb-3">2. Team Members</div>
                  <div className="space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-[#0A0F16] p-3 rounded-lg border border-[#1E3A5F]">
                      <input type="text" className="mobile-input" placeholder="Member 1 Name *" value={form.m1Name} onChange={e => set('m1Name', e.target.value)} />
                      <input type="text" className="mobile-input" placeholder="Member 1 Roll No *" value={form.m1Roll} onChange={e => set('m1Roll', e.target.value)} />
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-[#0A0F16] p-3 rounded-lg border border-[#1E3A5F]">
                      <input type="text" className="mobile-input" placeholder="Member 2 Name *" value={form.m2Name} onChange={e => set('m2Name', e.target.value)} />
                      <input type="text" className="mobile-input" placeholder="Member 2 Roll No *" value={form.m2Roll} onChange={e => set('m2Roll', e.target.value)} />
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-[#0A0F16] p-3 rounded-lg border border-[#1E3A5F]">
                      <input type="text" className="mobile-input" placeholder="Member 3 Name (optional)" value={form.m3Name} onChange={e => set('m3Name', e.target.value)} />
                      <input type="text" className="mobile-input" placeholder="Member 3 Roll No (optional)" value={form.m3Roll} onChange={e => set('m3Roll', e.target.value)} />
                    </div>
                  </div>
                </div>

                <div>
                  <div className="font-heading text-xs font-bold text-[#29ABE2] uppercase tracking-wider mb-3">3. Upload Payment Receipt Proof (₹120)</div>
                  <div className="border-2 border-dashed border-[#1E3A5F] hover:border-[#29ABE2] rounded-xl p-5 text-center bg-[#0A0F16] relative cursor-pointer">
                    <input type="file" accept="image/*, application/pdf" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e => e.target.files && handleFile(e.target.files[0])} />
                    {file ? (
                      <div>
                        {filePreview && <img src={filePreview} className="w-24 h-24 object-cover rounded mx-auto mb-2 border border-[#1E3A5F]" />}
                        <div className="font-bold text-xs text-white truncate">{file.name}</div>
                        <div className="text-[10px] text-green-400 font-semibold mt-1">Receipt Attached (Click to change)</div>
                      </div>
                    ) : (
                      <div>
                        <div className="font-bold text-xs text-white">Click or Drag Payment Screenshot (PNG/JPG/PDF)</div>
                        <div className="text-[10px] text-[#64748B]">Max 12MB</div>
                      </div>
                    )}
                  </div>
                  {errors.file && <p className="text-red-400 text-xs mt-1">{errors.file}</p>}
                </div>

                <button type="submit" className="btn-launch w-full py-3.5 text-sm font-extrabold">Complete Registration</button>
              </form>
            </div>
          </section>
        );
      }

      function FloatingMobileCTA({ isSubmitted }) {
        const [vis, setVis] = useState(false);
        useEffect(() => {
          const h = () => {
            if (isSubmitted) {
              setVis(false);
              return;
            }
            const scrolled = window.scrollY > 250;
            const regEl = document.getElementById('register');
            let isNearRegister = false;
            if (regEl) {
              const rect = regEl.getBoundingClientRect();
              isNearRegister = rect.top <= window.innerHeight - 100;
            }
            setVis(scrolled && !isNearRegister);
          };
          window.addEventListener('scroll', h);
          h();
          return () => window.removeEventListener('scroll', h);
        }, [isSubmitted]);

        if (isSubmitted || !vis) return null;
        return (
          <div className="md:hidden fixed bottom-3 left-3 right-3 z-40">
            <div className="bg-[#0D1117]/95 border border-[#1E3A5F] p-3 rounded-xl shadow-2xl flex items-center justify-between gap-3">
              <div>
                <div className="font-heading font-extrabold text-xs text-white">THRUST <span className="text-[#29ABE2]">5.0</span></div>
                <div className="text-[10px] text-[#29ABE2] font-semibold">₹120 / Team</div>
              </div>
              <a href="#register" className="btn-launch px-4 py-2 text-xs font-bold">Register Team</a>
            </div>
          </div>
        );
      }

      function Footer() {
        return (
          <footer className="bg-[#080C11] border-t border-[#1E3A5F] py-8 px-4 text-center sm:text-left">
            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-[#64748B]">
              <div className="flex items-center gap-3">
                <img src="/afc-user-logo.jpg" alt="Aero Fabrication Club" className="h-10 w-auto object-contain block" onError={(e)=>{e.target.onerror=null; e.target.src='/afc-logo.png';}} />
                <div>
                  <div className="font-heading font-extrabold text-sm text-white mb-0.5">THRUST <span className="text-[#29ABE2]">5.0</span></div>
                  <div className="text-[#29ABE2] font-semibold">Aero Fabrication Club, IIITDM Jabalpur</div>
                </div>
              </div>
              <div className="text-slate-300 font-medium">© 2025 Aero Fabrication Club, IIITDM Jabalpur. All rights reserved.</div>
            </div>
          </footer>
        );
      }

      function App() {
        const [isSubmitted, setIsSubmitted] = useState(false);
        return (
          <div>
            <Navbar />
            <Hero />
            <EventDetails />
            <RegistrationForm onSubmittedStateChange={setIsSubmitted} />
            <Footer />
            <FloatingMobileCTA isSubmitted={isSubmitted} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
  </script>
</body>
</html>
