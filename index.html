      }

      function RegistrationForm({ onSubmittedStateChange }) {
        const [form, setForm] = useState({
          teamName: '', teamLeader: '', leaderRoll: '', leaderPhone: '',
          m1Name: '', m1Roll: '', m2Name: '', m2Roll: '', m3Name: '', m3Roll: ''
        });
        const [file, setFile] = useState(null);
        const [filePreview, setFilePreview] = useState(null);
        const [fileBase64, setFileBase64] = useState('');
        const [errors, setErrors] = useState({});
        const [submittedData, setSubmittedData] = useState(null);
        const [copiedUpi, setCopiedUpi] = useState(false);
        const [selectedQr, setSelectedQr] = useState('qr1');

        const [existingTeams, setExistingTeams] = useState(() => {
          const teams = new Set();
          try {
            const stored = JSON.parse(localStorage.getItem('thrust5_existing_teams') || '[]');
            if (Array.isArray(stored)) stored.forEach((t) => t && teams.add(t.trim()));
            const registrations = JSON.parse(localStorage.getItem('thrust5_registrations') || '[]');
            if (Array.isArray(registrations)) {
              registrations.forEach((r) => { if (r && r.teamName) teams.add(r.teamName.trim()); });
            }
          } catch (_) {}
          return Array.from(teams);
        });

        const qrOptions = {
          qr1: {
            name: 'Option 1 (Shirshendu)',
            payee: 'Shirshendu R Tripathi',
            upiId: 'shirsh8924@oksbi',
            image: '/payment-qr.png',
            alt: 'Thrust 5.0 Payment QR - shirsh8924@oksbi',
            link: 'upi://pay?pa=shirsh8924@oksbi&pn=Shirshendu%20R%20Tripathi&am=120&cu=INR&tn=Thrust%205.0%20Registration',
          },
          qr2: {
            name: 'Option 2 (Apurva)',
            payee: 'APURVA VERMA',
            upiId: 'vermaapurva33@ibl',
            image: '/payment-qr-2.png',
            alt: 'Thrust 5.0 Payment QR - vermaapurva33@ibl',
            link: 'upi://pay?pa=vermaapurva33@ibl&pn=APURVA%20VERMA&am=120&cu=INR&tn=Thrust%205.0%20Registration',
          },
        };

        const activeQr = qrOptions[selectedQr] || qrOptions.qr1;

        const copyUpiId = () => {
          if (navigator?.clipboard?.writeText) {
            navigator.clipboard.writeText(activeQr.upiId);
            setCopiedUpi(true);
            setTimeout(() => setCopiedUpi(false), 2000);
          }
        };

        useEffect(() => {
          const targetUrl = 'https://script.google.com/macros/s/AKfycbzbRFibdQV3w_UBY_iNif-qMuTWcMEtPahh56swLO2HVvGIa-2WAqhp38o70jzllYTD/exec';
          const mergeTeams = (newTeams) => {
            if (!Array.isArray(newTeams) || newTeams.length === 0) return;
            setExistingTeams((prev) => {
              const set = new Set(prev);
              newTeams.forEach((t) => t && set.add(t.trim()));
              const merged = Array.from(set);
              try { localStorage.setItem('thrust5_existing_teams', JSON.stringify(merged)); } catch (_) {}
              return merged;
            });
          };

          fetch(targetUrl)
            .then((res) => res.json())
            .then((data) => { if (data && Array.isArray(data.teams)) mergeTeams(data.teams); })
            .catch(() => {});

          try {
            const cbName = 'thrust5_cb_teams_idx_' + Math.floor(Math.random() * 1000000);
            window[cbName] = (data) => {
              if (data && Array.isArray(data.teams)) mergeTeams(data.teams);
              delete window[cbName];
              if (script.parentNode) script.parentNode.removeChild(script);
            };
            const script = document.createElement('script');
            script.src = `${targetUrl}?callback=${cbName}`;
            script.onerror = () => {
              delete window[cbName];
              if (script.parentNode) script.parentNode.removeChild(script);
            };
            document.body.appendChild(script);
          } catch (_) {}

          fetch('https://docs.google.com/spreadsheets/d/1U_W0ghyQQN_LT6BUu9mInyWEHy6og-VqcP85lzwXlgY/gviz/tq?tqx=out:json')
            .then((res) => res.text())
            .then((txt) => {
              const jsonMatch = txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);/);
              if (jsonMatch && jsonMatch[1]) {
                const parsed = JSON.parse(jsonMatch[1]);
                const rows = parsed?.table?.rows || [];
                const gvizTeams = rows
                  .map((r) => r?.c?.[1]?.v)
                  .filter((v) => v && typeof v === 'string' && v.trim() && v !== 'Team Name');
                mergeTeams(gvizTeams);
              }
            })
            .catch(() => {});
        }, []);

        useEffect(() => {
          if (onSubmittedStateChange) onSubmittedStateChange(!!submittedData);
        }, [submittedData]);

        const normalizeTeamName = (name) => (name || '').toLowerCase().replace(/[^a-z0-9_]/g, '');

        const checkTeamName = (name, isBlurOrSubmit = false) => {
          const trimmed = (name || '').trim();
          if (!trimmed) {
            return isBlurOrSubmit ? 'Team Name is required.' : null;
          }
          if (!/^[a-zA-Z0-9_ ]+$/.test(trimmed)) {
            return 'Special characters are not allowed! Use only letters, numbers, spaces, and underscores (_).';
          }
          const norm = normalizeTeamName(trimmed);
          if (!norm) return null;
          const match = existingTeams.find((existing) => normalizeTeamName(existing) === norm);
          if (match) {
            return `Team name "${trimmed}" already exists! Please choose a different team name.`;
          }
          return null;
        };

        const handleTeamNameChange = (e) => {
          const val = e.target.value;
          setForm((prev) => ({ ...prev, teamName: val }));
          const err = checkTeamName(val, false);
          setErrors((prev) => ({ ...prev, teamName: err }));
        };

        const handleTeamNameBlur = () => {
          const err = checkTeamName(form.teamName, true);
          setErrors((prev) => ({ ...prev, teamName: err }));
        };

        const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
        
        const compressImage = (file) =>
          new Promise((resolve) => {
            if (file.type === 'application/pdf') {
              const r = new FileReader();
              r.onload = (e) => resolve(e.target.result);
              r.readAsDataURL(file);
              return;
            }
            const img = new Image();
            const objUrl = URL.createObjectURL(file);
            img.onload = () => {
              URL.revokeObjectURL(objUrl);
              const MAX = 900;
              let w = img.width, h = img.height;
              if (w > MAX || h > MAX) {
                if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                else { w = Math.round(w * MAX / h); h = MAX; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.65));
            };
            img.onerror = () => {
              URL.revokeObjectURL(objUrl);
              const r = new FileReader();
              r.onload = (e) => resolve(e.target.result);
              r.readAsDataURL(file);
            };
            img.src = objUrl;
          });

        const handleFile = async (f) => {
          if (!f) return;
          setFile(f);
          if (f.type.startsWith('image/')) {
            const r = new FileReader();
            r.onloadend = () => setFilePreview(r.result);
            r.readAsDataURL(f);
          } else {
            setFilePreview(null);
          }
          const compressed = await compressImage(f);
          setFileBase64(compressed);
        };

        const validate = () => {
          const e = {};
          const teamErr = checkTeamName(form.teamName, true);
          if (teamErr) e.teamName = teamErr;

          if (!form.teamLeader.trim()) e.teamLeader = 'Required';
          if (!form.leaderRoll.trim()) e.leaderRoll = 'Required';
          else if (!/^\d{10}$/.test(form.leaderPhone.replace(/\s/g, ''))) e.leaderPhone = 'Enter valid 10-digit number';
          if (!form.m1Name.trim()) e.m1Name = 'Required';
          if (!form.m1Roll.trim()) e.m1Roll = 'Required';
          if (!form.m2Name.trim()) e.m2Name = 'Required';
          if (!form.m2Roll.trim()) e.m2Roll = 'Required';
          if (!file) e.file = 'Payment receipt is compulsory! Please upload your payment screenshot to complete registration.';
          setErrors(e);
          return Object.keys(e).length === 0;
        };

        const handleSubmit = async (ev) => {
          ev.preventDefault();
          if (!validate()) {
            const teamErr = checkTeamName(form.teamName, true);
            if (teamErr) {
              const el = document.getElementById('teamName-idx');
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (!file) {
              const el = document.getElementById('receipt-upload-zone-idx');
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
          }

          const data = {
            regId: 'THRUST5-' + Math.floor(100000 + Math.random() * 900000),
            timestamp: new Date().toISOString(),
            ...form,
            fileName: file.name,
            fileData: fileBase64,
            paymentReceipt: fileBase64,
            paymentBase64: fileBase64,
          };
          const payloadStr = JSON.stringify(data);
          const targetUrl = 'https://script.google.com/macros/s/AKfycbzbRFibdQV3w_UBY_iNif-qMuTWcMEtPahh56swLO2HVvGIa-2WAqhp38o70jzllYTD/exec';
          
          // 1. PRIMARY: fetch POST with text/plain (CORS-safe simple request, raw JSON in postData.contents)
          try {
            fetch(targetUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: payloadStr,
            }).catch(() => {});
          } catch (_) {}

          // 2. SECONDARY: sendBeacon
          try {
            if (typeof navigator !== 'undefined' && navigator.sendBeacon) {
              const blob = new Blob([payloadStr], { type: 'text/plain;charset=utf-8' });
              navigator.sendBeacon(targetUrl, blob);
            }
          } catch (_) {}

          // 3. TERTIARY: Hidden iframe + form POST
          try {
            const iframeName = 'thrust5_iframe_' + Date.now();
            const iframe = document.createElement('iframe');
            iframe.name = iframeName;
            iframe.id = iframeName;
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            const formEl = document.createElement('form');
            formEl.method = 'POST';
            formEl.action = targetUrl;
            formEl.target = iframeName;
            const inputEl = document.createElement('input');
            inputEl.type = 'hidden';
            inputEl.name = 'payload';
            inputEl.value = payloadStr;
            formEl.appendChild(inputEl);
            document.body.appendChild(formEl);
            formEl.submit();
            setTimeout(() => { if (formEl.parentNode) formEl.parentNode.removeChild(formEl); }, 2000);
            setTimeout(() => { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 20000);
          } catch (_) {}

          // Save to local team set
          setExistingTeams((prev) => [...prev, data.teamName]);
          try {
            const saved = JSON.parse(localStorage.getItem('thrust5_existing_teams') || '[]');
            saved.push(data.teamName);
            localStorage.setItem('thrust5_existing_teams', JSON.stringify(saved));
          } catch (_) {}

          // localStorage offline backup
          try {
            const existing = JSON.parse(localStorage.getItem('thrust5_registrations') || '[]');
            existing.push(data);
            localStorage.setItem('thrust5_registrations', JSON.stringify(existing));
          } catch(_) {}

          setSubmittedData(data);
        };

        const handleDone = () => {
          setSubmittedData(null);
          setForm({ teamName: '', teamLeader: '', leaderRoll: '', leaderPhone: '', m1Name: '', m1Roll: '', m2Name: '', m2Roll: '', m3Name: '', m3Roll: '' });
          setFile(null); setFilePreview(null); setFileBase64('');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        if (submittedData) return (
          <section id="register" className="py-20 px-4 bg-[#080C11] border-t border-[#1E3A5F]">
            <div className="max-w-xl mx-auto cyber-card p-8 text-center space-y-5 relative overflow-hidden">
              <img src="/afc-logo-transparent.png" alt="AFC Logo" style={{height:'2.5rem',width:'auto',objectFit:'contain',filter:'drop-shadow(0 0 10px rgba(41,171,226,0.6))',display:'block'}} onError={(e)=>{e.target.onerror=null;e.target.src='/afc-user-logo.jpg'}} />

              <div>
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono font-semibold uppercase tracking-wider mb-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  Registration Confirmed
                </div>
                <h3 className="font-heading font-extrabold text-3xl text-white tracking-tight">Registration <span className="text-[#29ABE2]">Successful!</span></h3>
                <p className="text-xs text-[#94A3B8] mt-1">Your team registration and payment proof have been officially logged in the competition sheet.</p>
              </div>

              <div className="bg-[#0A0F16] border border-[#1E3A5F] rounded-xl p-5 text-left space-y-3 font-sans">
                <div className="flex justify-between items-center border-b border-[#1E3A5F] pb-3">
                  <div>
                    <div className="text-[10px] font-mono uppercase tracking-widest text-[#64748B]">Registered Team</div>
                    <div className="font-heading font-bold text-lg text-white">{submittedData.teamName}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-[10px] font-mono uppercase tracking-widest text-[#64748B]">Reg ID</div>
                    <div className="font-mono font-bold text-sm text-[#29ABE2] bg-[#29ABE2]/10 px-2 py-0.5 rounded border border-[#29ABE2]/30">{submittedData.regId}</div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs pt-1">
                  <div>
                    <span className="text-[#64748B] block text-[10px] uppercase font-mono">Team Leader</span>
                    <span className="font-semibold text-white">{submittedData.teamLeader}</span>
                    <span className="text-[11px] text-[#94A3B8] block">({submittedData.leaderRoll})</span>
                  </div>
                  <div>
                    <span className="text-[#64748B] block text-[10px] uppercase font-mono">Leader Phone</span>
                    <span className="font-mono text-white">{submittedData.leaderPhone}</span>
                  </div>
                  <div>
                    <span className="text-[#64748B] block text-[10px] uppercase font-mono">Teammates</span>
                    <span className="text-white font-medium">{submittedData.m1Name}, {submittedData.m2Name}{submittedData.m3Name ? `, ${submittedData.m3Name}` : ''}</span>
                  </div>
                  <div>
                    <span className="text-[#64748B] block text-[10px] uppercase font-mono">Payment Status</span>
                    <span className="text-emerald-400 font-bold">₹120 Submitted</span>
                  </div>
                </div>
              </div>

              <div className="bg-[#1E6FBA]/10 border border-[#29ABE2]/30 rounded-xl p-4 text-left space-y-1.5">
                <div className="flex items-center gap-2 text-xs font-bold text-[#29ABE2] uppercase tracking-wider">
                  Important Notice for Participants:
                </div>
                <p className="text-xs text-slate-200 leading-relaxed">
                  Stay tuned on the official <strong>Thrust 5.0 WhatsApp Group</strong> and website for the official rulebook, launch schedule, domain briefing, and event guidelines!
                </p>
              </div>

              <button onClick={handleDone} className="w-full py-4 px-6 rounded-xl bg-gradient-to-r from-[#1E6FBA] to-[#29ABE2] hover:opacity-95 text-white font-heading font-extrabold text-sm uppercase tracking-wider shadow-lg shadow-[#29ABE2]/20">
                Registration Done
              </button>
            </div>
          </section>
        );

        return (
          <section id="register" className="py-16 px-4 bg-[#080C11] border-t border-[#1E3A5F]">
            <div className="max-w-2xl mx-auto">
              <div className="text-center mb-10">
                <h2 className="font-heading font-extrabold text-3xl sm:text-4xl text-white tracking-tight mb-2">Register Your <span className="text-[#29ABE2]">Team</span></h2>
                <p className="text-xs sm:text-sm text-[#94A3B8]">Registration Fee: ₹120 / Team · Upload screenshot directly below</p>
              </div>

              <form onSubmit={handleSubmit} className="cyber-card p-5 sm:p-8 space-y-6">
                <div>
                  <div className="font-heading text-xs font-bold text-[#29ABE2] uppercase tracking-wider mb-3">1. Team Information</div>
                  <div className="space-y-3">
                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="block text-xs text-[#94A3B8]">
                          Team Name <span className="text-[#29ABE2]">*</span>
                        </label>
                        <span className="text-[10px] text-[#64748B] font-mono">
                          Letters, numbers, spaces & underscores (_) only
                        </span>
                      </div>
                      <input
                        id="teamName-idx"
                        type="text"
                        className={`mobile-input ${
                          errors.teamName
                            ? 'border-rose-500/80 bg-rose-500/5'
                            : form.teamName.trim().length >= 3 && !errors.teamName
                            ? 'border-emerald-500/50'
                            : ''
                        }`}
                        placeholder="e.g. AeroWolves_1"
                        value={form.teamName}
                        onChange={handleTeamNameChange}
                        onBlur={handleTeamNameBlur}
                      />
                      {errors.teamName ? (
                        <div className="flex items-center gap-1.5 mt-1.5 text-xs text-rose-400 font-medium bg-rose-500/10 border border-rose-500/30 px-3 py-1.5 rounded-lg">
                          <span>{errors.teamName}</span>
                        </div>
                      ) : form.teamName.trim().length >= 3 ? (
                        <div className="flex items-center gap-1.5 mt-1 text-[11px] text-emerald-400 font-medium">
                          <span>✓ Team name is available</span>
                        </div>
                      ) : null}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs text-[#94A3B8] mb-1">Leader Name <span className="text-[#29ABE2]">*</span></label>
                        <input type="text" className="mobile-input" placeholder="Full Name" value={form.teamLeader} onChange={e => set('teamLeader', e.target.value)} />
                        {errors.teamLeader && <p className="text-red-400 text-xs mt-1">{errors.teamLeader}</p>}
                      </div>
                      <div>
                        <label className="block text-xs text-[#94A3B8] mb-1">Leader Roll No <span className="text-[#29ABE2]">*</span></label>
                        <input type="text" className="mobile-input" placeholder="e.g. 2024UCS001" value={form.leaderRoll} onChange={e => set('leaderRoll', e.target.value)} />
                        {errors.leaderRoll && <p className="text-red-400 text-xs mt-1">{errors.leaderRoll}</p>}
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs text-[#94A3B8] mb-1">Leader Mobile No <span className="text-[#29ABE2]">*</span></label>
                      <input type="tel" className="mobile-input" placeholder="10-digit Mobile Number" value={form.leaderPhone} onChange={e => set('leaderPhone', e.target.value)} />
                      {errors.leaderPhone && <p className="text-red-400 text-xs mt-1">{errors.leaderPhone}</p>}
                    </div>
                  </div>
                </div>

                <div>
                  <div className="font-heading text-xs font-bold text-[#29ABE2] uppercase tracking-wider mb-3">2. Team Members</div>
                  <div className="space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-[#0A0F16] p-3 rounded-lg border border-[#1E3A5F]">
                      <input type="text" className="mobile-input" placeholder="Member 1 Name *" value={form.m1Name} onChange={e => set('m1Name', e.target.value)} />
                      <input type="text" className="mobile-input" placeholder="Member 1 Roll No *" value={form.m1Roll} onChange={e => set('m1Roll', e.target.value)} />
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-[#0A0F16] p-3 rounded-lg border border-[#1E3A5F]">
                      <input type="text" className="mobile-input" placeholder="Member 2 Name *" value={form.m2Name} onChange={e => set('m2Name', e.target.value)} />
                      <input type="text" className="mobile-input" placeholder="Member 2 Roll No *" value={form.m2Roll} onChange={e => set('m2Roll', e.target.value)} />
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-[#0A0F16] p-3 rounded-lg border border-[#1E3A5F]">
                      <input type="text" className="mobile-input" placeholder="Member 3 Name (optional)" value={form.m3Name} onChange={e => set('m3Name', e.target.value)} />
                      <input type="text" className="mobile-input" placeholder="Member 3 Roll No (optional)" value={form.m3Roll} onChange={e => set('m3Roll', e.target.value)} />
                    </div>
                  </div>
                </div>

                <div>
                  <div className="font-heading text-xs font-bold text-[#29ABE2] uppercase tracking-wider mb-3">
                    3. Upload Payment Receipt Proof (₹120) <span className="text-red-400 font-bold text-sm">*</span> <span className="text-red-400 text-[11px] font-mono lowercase tracking-normal font-semibold">(compulsory)</span>
                  </div>

                  {/* Official Themed Payment QR Card */}
                  <div className="relative rounded-xl border border-[#1E3A5F] bg-[#0A0F16] p-4 sm:p-5 text-center overflow-hidden transition-all duration-200 hover:border-[#29ABE2]/50 shadow-[0_4px_20px_rgba(0,0,0,0.35)] mb-4">
                    {/* Corner HUD Accents */}
                    <div className="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-[#29ABE2] pointer-events-none" />
                    <div className="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-[#29ABE2] pointer-events-none" />
                    <div className="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-[#29ABE2] pointer-events-none" />
                    <div className="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-[#29ABE2] pointer-events-none" />

                    {/* Header Info */}
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-2 border-b border-[#1E3A5F]/60 pb-3 mb-3.5">
                      <div className="text-center sm:text-left flex items-center gap-2">
                        <div className="w-2.5 h-2.5 rounded-full bg-[#29ABE2] animate-pulse shrink-0" />
                        <div>
                          <div className="text-xs font-bold text-white tracking-wide uppercase font-heading">
                            Official UPI Payment QR
                          </div>
                          <div className="text-[11px] text-[#94A3B8]">
                            Payee: <span className="text-white font-medium">{activeQr.payee}</span>
                          </div>
                        </div>
                      </div>
                      <div className="px-3 py-1 rounded-full bg-[#29ABE2]/10 border border-[#29ABE2]/30 text-[#29ABE2] text-xs font-bold tracking-wider font-heading">
                        ₹120 / TEAM
                      </div>
                    </div>

                    {/* QR Option Selector Tabs */}
                    <div className="flex items-center justify-center gap-1.5 mb-3 p-1 rounded-xl bg-[#111827] border border-[#1E3A5F] max-w-sm mx-auto">
                      <button
                        type="button"
                        onClick={() => setSelectedQr('qr1')}
                        className={`flex-1 py-1.5 px-2.5 rounded-lg text-xs font-heading font-semibold transition-all cursor-pointer ${
                          selectedQr === 'qr1'
                            ? 'bg-[#29ABE2] text-[#0A0F16] shadow-[0_0_12px_rgba(41,171,226,0.35)]'
                            : 'text-[#94A3B8] hover:text-white'
                        }`}
                      >
                        Option 1 (Shirshendu)
                      </button>
                      <button
                        type="button"
                        onClick={() => setSelectedQr('qr2')}
                        className={`flex-1 py-1.5 px-2.5 rounded-lg text-xs font-heading font-semibold transition-all cursor-pointer ${
                          selectedQr === 'qr2'
                            ? 'bg-[#29ABE2] text-[#0A0F16] shadow-[0_0_12px_rgba(41,171,226,0.35)]'
                            : 'text-[#94A3B8] hover:text-white'
                        }`}
                      >

                      </button>
                    </div>

                    {/* QR Image with aerospace glow frame */}
                    <div className="relative inline-block my-1">
                      <div className="p-2.5 bg-white rounded-xl shadow-[0_0_25px_rgba(41,171,226,0.18)] border border-[#29ABE2]/40 inline-block">
                        <img
                          src={activeQr.image}
                          alt={activeQr.alt}
                          className="w-44 h-44 sm:w-52 sm:h-52 object-contain rounded-lg mx-auto block"
                        />
                      </div>
                      <div className="mt-2 text-[11px] text-[#94A3B8] font-medium">
                        Scan with GPay, PhonePe, Paytm, or any UPI app
                      </div>

                    {/* UPI ID & Interactive Copy Action */}
                    <div className="mt-3 flex flex-wrap items-center justify-center gap-2">

                        <span className="text-xs font-mono font-bold text-[#29ABE2] select-all">
                          {activeQr.upiId}
                        </span>
                        <button
                          type="button"
                          onClick={copyUpiId}
                          aria-label="Copy UPI ID"
                          className="ml-1 text-[11px] font-semibold text-white hover:text-[#29ABE2] px-2 py-0.5 rounded bg-[#1E3A5F]/60 hover:bg-[#1E3A5F] transition-colors inline-flex items-center gap-1 cursor-pointer"
                        >
                          {copiedUpi ? (
                            <>
                              <svg className="w-3 h-3 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                              </svg>
                              <span className="text-emerald-400 font-bold">Copied!</span>
                            </>
                          ) : (
                            <>
                              <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                              </svg>
                              <span>Copy</span>
                            </>
                          )}
                        </button>
                      </div>

                      {/* Direct Mobile UPI Pay Button */}
                      <a
                        href={activeQr.link}
                        className="sm:hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#29ABE2]/15 border border-[#29ABE2]/40 text-[#29ABE2] text-xs font-bold font-heading hover:bg-[#29ABE2]/25 transition-all"
                      >
                        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                        <span>Pay ₹120 in UPI App</span>
                      </a>
                    </div>

                    <div className="text-[11px] text-[#64748B] mt-3 pt-2.5 border-t border-[#1E3A5F]/40 flex flex-wrap items-center justify-center gap-1.5 sm:gap-3">
                      <span className="text-[#29ABE2]">① Pay ₹120</span>
                      <span>→</span>
                      <span className="text-[#29ABE2]">② Take Screenshot</span>
                      <span>→</span>
                      <span className="text-[#29ABE2]">③ Upload Proof Below</span>
                    </div>
                  </div>

                  <div id="receipt-upload-zone-idx" className={`border-2 border-dashed ${errors.file ? 'border-red-500 bg-red-500/10 shadow-[0_0_20px_rgba(239,68,68,0.25)]' : file ? 'border-emerald-500/60 bg-[#0A0F16]' : 'border-[#1E3A5F] hover:border-[#29ABE2] bg-[#0A0F16]'} rounded-xl p-5 text-center relative cursor-pointer transition-all`}>
                    <input type="file" accept="image/*, application/pdf" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e => e.target.files && handleFile(e.target.files[0])} />
                    {file ? (
                      <div>
                        {filePreview && <img src={filePreview} className="w-24 h-24 object-cover rounded mx-auto mb-2 border border-[#1E3A5F]" />}
                        <div className="font-bold text-xs text-white truncate">{file.name}</div>
                        <div className="text-[10px] text-green-400 font-semibold mt-1">Receipt Attached (Click to change)</div>
                      </div>

                      <div>
                        <div className="font-bold text-xs text-white">Click or Drag Payment Screenshot (PNG/JPG/PDF) <span className="text-red-400 font-bold">*</span></div>
                        <div className="text-[10px] text-[#64748B]">Max 12MB</div>
                        <div className="inline-block mt-1 px-2.5 py-0.5 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-[10px] font-mono font-bold uppercase tracking-wider">
                          Compulsory for submission
                        </div>
                      </div>
                    )}
                  </div>
                  {errors.file && (
                    <div className="p-3 mt-2 rounded-lg bg-red-500/10 border border-red-500/40 text-red-400 text-xs font-semibold flex items-center gap-2">
                      <svg className="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                      </svg>
                      <span>{errors.file}</span>
                    </div>
                  )}
                </div>

                <button type="submit" className="btn-launch w-full py-3.5 text-sm font-extrabold">Complete Registration</button>
              </form>

              {/* Contact & Help Panel below registration column */}
              <div id="contacts" className="mt-8 sm:mt-10 p-5 sm:p-7 rounded-2xl bg-gradient-to-b from-[#101E33] to-[#0B1525] border-2 border-[#1E6FBA]/40 shadow-[0_8px_30px_rgba(30,111,186,0.18)] relative overflow-hidden">
                {/* Subtle glowing accent gradient on top */}
                <div className="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#29ABE2] to-transparent opacity-80" />

                <div className="flex items-center gap-3 mb-5 pb-3.5 border-b border-[#1E4E7A]/50">
                  <div className="w-9 h-9 rounded-xl bg-[#29ABE2]/20 border border-[#29ABE2]/50 flex items-center justify-center text-[#29ABE2] shrink-0 shadow-[0_0_15px_rgba(41,171,226,0.3)]">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                  </div>
                  <div>
                    <h3 className="font-heading font-extrabold text-base sm:text-lg text-white tracking-wide flex items-center gap-2">
                      Need Help? Contact Us
                      <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-[#29ABE2]/15 text-[#29ABE2] border border-[#29ABE2]/30 uppercase">Support</span>
                    </h3>
                    <p className="text-[11px] sm:text-xs text-[#94A3B8]">
                      Reach out to the event coordinators or registration helpdesk anytime
                    </p>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                  {/* Event Coordinator */}
                  <div className="p-4 rounded-xl bg-[#14233A]/90 border border-[#1E568A]/60 hover:border-[#29ABE2]/60 transition-all shadow-sm">
                    <div className="text-[10px] font-mono font-bold text-[#29ABE2] uppercase tracking-wider mb-1">
                      Event Coordinator
                    </div>
                    <div className="text-sm sm:text-base font-semibold text-white">Arjun Nigam</div>
                    <a
                      href="tel:9235665193"
                      className="mt-2 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#0C1726] border border-[#1E4E7A]/60 text-xs text-[#cbd5e1] hover:text-white hover:border-[#29ABE2] transition-all font-mono font-medium"
                      style={{textDecoration:'none'}}
                    >
                      <svg className="w-3.5 h-3.5 text-[#29ABE2]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                      </svg>
                      9235665193
                    </a>
                  </div>

                  {/* Event Co-Coordinator: Askini Joshi */}
                  <div className="p-4 rounded-xl bg-[#14233A]/90 border border-[#1E568A]/60 hover:border-[#29ABE2]/60 transition-all shadow-sm">
                    <div className="text-[10px] font-mono font-bold text-[#29ABE2] uppercase tracking-wider mb-1">
                      Event Co-Coordinator
                    </div>
                    <div className="text-sm sm:text-base font-semibold text-white">Askini Joshi</div>
                    <a
                      href="tel:9479952334"
                      className="mt-2 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#0C1726] border border-[#1E4E7A]/60 text-xs text-[#cbd5e1] hover:text-white hover:border-[#29ABE2] transition-all font-mono font-medium"
                      style={{textDecoration:'none'}}
                    >
                      <svg className="w-3.5 h-3.5 text-[#29ABE2]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                      </svg>
                      9479952334
                    </a>
                  </div>

                  {/* Event Co-Coordinator: Ruthik Roy */}
                  <div className="p-4 rounded-xl bg-[#14233A]/90 border border-[#1E568A]/60 hover:border-[#29ABE2]/60 transition-all shadow-sm">
                    <div className="text-[10px] font-mono font-bold text-[#29ABE2] uppercase tracking-wider mb-1">
                      Event Co-Coordinator
                    </div>
                    <div className="text-sm sm:text-base font-semibold text-white">Ruthik Roy</div>
                    <a
                      href="tel:9989275764"
                      className="mt-2 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#0C1726] border border-[#1E4E7A]/60 text-xs text-[#cbd5e1] hover:text-white hover:border-[#29ABE2] transition-all font-mono font-medium"
                      style={{textDecoration:'none'}}
                    >
                      <svg className="w-3.5 h-3.5 text-[#29ABE2]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                      </svg>
                      9989275764
                    </a>
                  </div>
                </div>

                {/* Registration Queries - slightly highlighted with distinctive tone */}
                <div className="p-4 rounded-xl bg-gradient-to-r from-[#173252] via-[#1B3B60] to-[#173252] border border-[#29ABE2]/50 shadow-[0_0_20px_rgba(41,171,226,0.15)] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div className="flex items-center gap-3">
                    <span className="w-2.5 h-2.5 rounded-full bg-[#29ABE2] animate-pulse shrink-0 shadow-[0_0_8px_#29ABE2]" />
                    <div>
                      <div className="text-[10px] font-mono font-bold text-[#29ABE2] uppercase tracking-wider">
                        Registration Queries
                      </div>
                      <div className="text-sm sm:text-base font-semibold text-white">Lakshay</div>
                    </div>
                  </div>
                  <a
                    href="tel:9729088820"
                    className="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-[#29ABE2] hover:bg-[#1E6FBA] text-[#0D1117] hover:text-white text-xs font-bold font-mono transition-all no-underline shadow-md shadow-[#29ABE2]/20"
                    style={{textDecoration:'none'}}
                  >
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                    9729088820
                  </a>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function FloatingMobileCTA({ isSubmitted }) {
        const [vis, setVis] = useState(false);
        useEffect(() => {
          const h = () => {
            if (isSubmitted) {
              setVis(false);
              return;
            }
            const scrolled = window.scrollY > 250;
            const regEl = document.getElementById('register');
            let isNearRegister = false;
            if (regEl) {
              const rect = regEl.getBoundingClientRect();
              isNearRegister = rect.top <= window.innerHeight - 100;
            }
            setVis(scrolled && !isNearRegister);
          };
          window.addEventListener('scroll', h);
          h();
          return () => window.removeEventListener('scroll', h);
        }, [isSubmitted]);

        if (isSubmitted || !vis) return null;
        return (
          <div className="md:hidden fixed bottom-3 left-3 right-3 z-40">
            <div className="bg-[#0D1117]/95 border border-[#1E3A5F] p-3 rounded-xl shadow-2xl flex items-center justify-between gap-3">
              <div>
                <div className="font-heading font-extrabold text-xs text-white">THRUST <span className="text-[#29ABE2]">5.0</span></div>
                <div className="text-[10px] text-[#29ABE2] font-semibold">₹120 / Team</div>
              </div>
              <a href="#register" className="btn-launch px-4 py-2 text-xs font-bold">Register Team</a>
            </div>
          </div>
        );
      }

      function Footer() {
        return (
          <footer className="bg-[#080C11] border-t border-[#1E3A5F] py-8 px-4 text-center sm:text-left">
            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-[#64748B]">
              <div className="flex items-center gap-3">
                <img src="/afc-logo-transparent.png" alt="AFC Logo" style={{height:'2.5rem',width:'auto',objectFit:'contain',filter:'drop-shadow(0 0 10px rgba(41,171,226,0.6))',display:'block'}} onError={(e)=>{e.target.onerror=null;e.target.src='/afc-user-logo.jpg'}} />
                <div>
                  <div className="font-heading font-extrabold text-sm text-white mb-0.5">THRUST <span className="text-[#29ABE2]">5.0</span></div>
                  <div className="text-[#29ABE2] font-semibold">Aero Fabrication Club, IIITDM Jabalpur</div>
                </div>
              </div>
              <div className="text-slate-300 font-medium">© 2025 Aero Fabrication Club, IIITDM Jabalpur. All rights reserved.</div>
            </div>
          </footer>
        );
      }

      function App() {
        const [isSubmitted, setIsSubmitted] = useState(false);
        return (
          <div>
            <Navbar />
            <Hero />
            <EventDetails />
            <RegistrationForm onSubmittedStateChange={setIsSubmitted} />
            <Footer />
            <FloatingMobileCTA isSubmitted={isSubmitted} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
  </script>
</body>
